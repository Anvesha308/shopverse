spring.application.name=shopverse-backend

# ---- MongoDB ----
# Reads from MONGODB_URI env var if set, otherwise falls back to local dev default.
# Never commit real production credentials to git.
# Local dev: mongodb://localhost:27017/shopverse_db
# Atlas prod: mongodb+srv://<user>:<password>@<cluster-url>/shopverse_db?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/shopverse_db}

# ---- Server ----
server.port=${PORT:8080}

# ---- CORS ----
# Comma-separated list of allowed frontend origins in production, e.g. your Vercel URL.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- JWT ----
# 256-bit+ secret. Set JWT_SECRET as an env var in production; falls back to a dev
# default locally. Never reuse the dev default in a real deployment.
jwt.secret=${JWT_SECRET:change-this-super-secret-key-shopverse-2026-minimum-32-bytes-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Logging ----
logging.level.org.springframework.security=INFO
