spring.application.name=shopverse-backend

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/shopverse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UT
spring.datasource.username=root
spring.datasource.password=Anvesha@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- Server ----
server.port=8080

# ---- JWT ----
# 256-bit+ secret; change this in production and load from an env var / vault instead.
jwt.secret=change-this-super-secret-key-shopverse-2026-minimum-32-bytes-long
jwt.expiration-ms=86400000

# ---- Logging ----
logging.level.org.springframework.security=INFO
